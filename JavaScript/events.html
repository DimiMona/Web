<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="events.css">
    <title>JavaScript Events</title>
</head>
<body>
    <h1>JavaScript Events</h1>

	<div class="images-and-colors">
		<div class="load-image">
			<div class="image-container">
				<img src="D:\Users\User\Pictures\1398215896_1768974925.jpg" alt="Фото студента" id="image">
			</div>
			<input type="file" id="image-file" onchange="setImage()">
			<div id="debug"></div>
		</div>

		<div class="colors">
			<div>
				<label for="background-color">Выберите цвет фона:</label>
				<input type="color" id="background-color" oninput="setBackgroundColor()">
			</div>
			<div>
				<label for="foreground-color">Выберите цвет текста:</label>
				<input type="color" id="foreground-color" oninput="setForegroundColor(event)">
			</div>
		</div>
	</div>

    <script>
		function setImage()
		{
			let filename = document.getElementById("image-file");
			//let reader = new FileReader();
			//reader.onload = function (e)
			//{
			//	document.getElementById("image").src = e.target.result;
			//}
			//reader.readAsDataURL(filename.files[0]);

			let file = filename.files[0];
			//document.getElementById("debug").innerHTML = filename.files[0].name;
			document.getElementById("debug").innerHTML = URL.createObjectURL(file);
			document.getElementById("image").src = URL.createObjectURL(file);
		}
		function setBackgroundColor()
		{
			document.body.style.backgroundColor = document.getElementById("background-color").value;
		}
		function setForegroundColor(e)
		{
			document.body.style.color = e.target.value;
		}
    </script>
</body>
</html>
